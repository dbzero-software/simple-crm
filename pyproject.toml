[project]
name = "simple-crm"
version = "0.1.0"
description = "A small dbzero and NiceGUI CRM tutorial app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbzero==0.5.0",
    "nicegui>=2.24.2",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.57.0",
    "pytest>=7.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
